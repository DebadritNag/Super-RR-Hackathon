[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Long SQL and report strings are kept readable instead of wrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["realdata: integration test on the real official CSVs (skipped when absent)"]
